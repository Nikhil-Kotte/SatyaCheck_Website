    <!-- Privacy-friendly analytics placeholder (disabled by default, managed via src/content.ts) -->
    <!--
    <script defer data-domain="satyacheck.in" src="https://plausible.io/js/script.js"></script>
    -->
    <!-- Apply the saved or system theme before first paint, so there is no flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sc-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          if (saved) {
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute("content", dark ? "#050614" : "#FDFAE7");
            });
          }
        } catch (e) {}
      })();
    </script>
